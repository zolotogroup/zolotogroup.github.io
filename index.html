<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<noscript><meta http-equiv="refresh" content="0;url=hub.html?v=r4"></noscript>
<title>Пульт ЗОЛОТОГРУПП</title>
<link rel="canonical" href="hub.html">
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}input{width:100%;font:15px monospace;padding:8px;box-sizing:border-box}button,a.b{display:inline-block;margin:12px 8px 0 0;padding:8px 14px;font:inherit;border:1px solid #333;background:#fff;color:#000;text-decoration:none;cursor:pointer}</style>
<!-- Zoom возвращает сюда после входа (?code=…): код показываем, а не теряем при переходе в пульт. -->
<script>
const code = new URLSearchParams(location.search).get("code");
if (!code) location.replace("hub.html?v=r4");
</script>
<div id="zoom" hidden>
  <h2>Код входа Zoom</h2>
  <p>1. Скопируйте код:</p>
  <input id="code" readonly onclick="this.select()">
  <button type="button" id="copy">Скопировать</button>
  <p>2. Откройте страницу ниже, нажмите «Run workflow», вставьте код в поле и снова нажмите «Run workflow». Код действует несколько минут.</p>
  <a class="b" href="https://github.com/zolotogroup/zg-pult/actions/workflows/zoom-notes-login.yml" target="_blank" rel="noopener">Открыть zoom-notes-login</a>
</div>
<p id="hub"><a href="hub.html?v=r4">Открыть пульт</a></p>
<script>
if (code) {
  document.getElementById("zoom").hidden = false;
  document.getElementById("hub").hidden = true;
  const f = document.getElementById("code");
  f.value = code;
  document.getElementById("copy").onclick = e => {
    f.select();
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).catch(() => document.execCommand("copy"))
      .finally(() => e.target.textContent = "Скопировано");
  };
}
</script>
