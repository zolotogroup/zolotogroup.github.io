async function openFile(f){const box=await (await fetch(f.u,{cache:"no-store"})).json();
 const k=await crypto.subtle.importKey("raw",ub(f.k),"AES-GCM",false,["decrypt"]);
 const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(box.iv)},k,ub(box.ct));
 const html=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 document.open();document.write(html);document.close();}

async function unlock(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
